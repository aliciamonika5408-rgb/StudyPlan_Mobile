name: studyplan
description: "StudyPlan - Catatan Tugas Sekolah"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  intl: ^0.20.0
  google_fonts: ^6.0.0
  uuid: ^4.0.0
  permission_handler: ^11.0.0
  table_calendar: ^3.2.0
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
